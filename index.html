<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E1F4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nails">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Nails Organiser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="themes.js"></script>
<style>
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --chip:#F1F0F6; --track:#E9E8F0; --line:#E4E3EC;
  --ink:#1E1F4B; --ink2:#55567A; --muted:#66678A;
  --head:#1E1F4B; --head2:#34355F; --headmuted:#B8B8D6;
  --teal:#0B7F74; --tealbg:#D6EFEB; --tealink:#0B5E55;
  --coral:#C8455F; --neg:#B3344F; --negbg:#FBE7EB; --pos:#2F7D4F; --posbg:#DDEFE2;
  --lilac:#E7E6F5; --gold:#7A4E14; --goldbg:#FBF3E6; --amber:#B9772A;
  --winter:#1F5FA8; --winterbg:#DCE9F8; --summer:#A0521C; --summerbg:#FBEBDD;
  --hatch:#ECEBF1; --scrim:rgba(20,20,45,.45); --staff:#DCE2F0; --staffink:#2B3566;
  --font-display:Comfortaa, "Varela Round", system-ui, sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121329; --surface:#1C1D3A; --chip:#26274A; --track:#2A2B4E; --line:#33345A;
  --ink:#EDEDF7; --ink2:#C2C2DD; --muted:#A3A3C6; --head:#0C0D22; --head2:#2A2B52; --headmuted:#A3A3C6;
  --teal:#13998B; --tealbg:#123F3B; --tealink:#8FE0D4; --coral:#D9607A; --neg:#F08AA0; --negbg:#3D1F2A; --pos:#7FD39C; --posbg:#183A27;
  --lilac:#2E2D55; --gold:#E6C48A; --goldbg:#3A2E1A; --amber:#E0A458; --winter:#9CC4F2; --winterbg:#1B3352; --summer:#F0B27A; --summerbg:#3D2A1A;
  --hatch:#23244A; --scrim:rgba(0,0,0,.6); --staff:#27305A; --staffink:#CFD8F5; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{background:var(--head);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-family:var(--font-display);font-size:12px;color:var(--headmuted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--head2);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.rbtn.sq{border-radius:12px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
main>*{flex-shrink:0}
nav{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;letter-spacing:-.2px;color:var(--muted);min-height:48px;position:relative;padding:0}
nav button.on{color:var(--teal);font-weight:700}
nav button.on::before{content:"";position:absolute;top:-8px;width:32px;height:3px;border-radius:2px;background:var(--teal)}
.badge{position:absolute;top:-4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.card{background:var(--surface);border-radius:22px;padding:16px}
.card.flush{padding:0;overflow:hidden}
.seg{display:flex;background:var(--track);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:none;background:transparent;border-radius:10px;min-height:38px;font-size:14px;font-weight:600;color:var(--ink2);padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm button{min-height:34px;font-size:13px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;min-height:38px;padding:0 14px;font-size:13px;font-weight:600;color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:22px;padding:4px 14px 4px 4px;background:var(--surface);min-height:36px;font-size:14px;font-weight:700;color:var(--ink)}
.tg .k{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.tg .k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{border-color:var(--teal)}.tg.on .k{background:var(--teal)}.tg.on .k::after{left:19px}
.tg.dark{background:transparent;border-color:var(--head2);color:#fff;padding-right:10px;flex-shrink:0}.tg.dark .k{background:var(--head2)}.tg.dark.on{border-color:var(--teal)}.tg.dark.on .k{background:var(--teal)}
.btn{border:none;border-radius:18px;min-height:52px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);color:#fff}.btn.navy{background:var(--ink);color:var(--surface)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}.btn.danger{background:var(--negbg);color:var(--neg)}
.btn.split{justify-content:space-between}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat{background:var(--chip);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--ink2)}.stat b{color:var(--ink)}
.svcrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.card.flush .svcrow:first-child{border-top:none}
.svcrow .row{border-top:none;flex:1;min-width:0;padding-right:8px}
.svcrow .web{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 14px 0 4px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;border-top:1px solid var(--line);width:100%;background:none;text-align:left;min-height:56px}
.row:first-child{border-top:none}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;background:var(--lilac);color:var(--ink)}
.t1{font-size:15px;font-weight:700}.t2{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px}
.t-teal{background:var(--tealbg);color:var(--tealink)}.t-lilac{background:var(--lilac);color:var(--ink)}.t-gray{background:var(--chip);color:var(--muted)}.t-neg{background:var(--negbg);color:var(--neg)}.t-gold{background:var(--goldbg);color:var(--gold)}
.mk{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border-radius:6px;min-width:18px;height:18px;padding:0 4px;background:var(--winterbg);color:var(--winter)}
.mk.m-x{background:var(--winterbg);color:var(--winter)}.mk.m-k{background:var(--summerbg);color:var(--summer)}.mk.m-v{background:var(--goldbg);color:var(--gold)}.mk.m-ns{background:var(--negbg);color:var(--neg)}.mk.m-bd{background:var(--posbg);color:var(--pos)}
.stage{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.st-new{background:var(--tealbg);color:var(--tealink)}.st-once,.st-none{background:var(--chip);color:var(--muted)}.st-regular{background:var(--posbg);color:var(--pos)}.st-late{background:var(--goldbg);color:var(--gold)}.st-lost{background:var(--negbg);color:var(--neg)}
.hs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs .pill{flex-shrink:0}.pill .ct{font-size:11px;opacity:.7}
.srch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:0 14px;min-height:48px}
.srch input{border:none;outline:none;background:transparent;font-size:16px;flex:1;color:var(--ink);min-width:0;font-family:inherit}
.why{background:var(--chip);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.why div{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.months div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--muted)}
.months i{display:block;width:100%;height:34px;border-radius:5px;background:var(--chip);position:relative;overflow:hidden}
.months i.sea{outline:1.5px dashed var(--summer);outline-offset:-1.5px}
.months i b{position:absolute;left:0;right:0;bottom:0;background:var(--teal)}
textarea.inp{height:auto;min-height:80px;line-height:1.4;padding:12px 14px;resize:vertical}
.kpi{background:var(--ink);color:var(--surface);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.kpi .lbl{color:var(--headmuted)}
.kpi .split3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi .split3 div{background:var(--head2);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--headmuted)}
.kpi .split3 b{display:block;color:#fff;font-size:17px;margin-top:2px}
.dl{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:none}.dl.tot{font-weight:800;font-size:16px;border-top:1.5px solid var(--ink);margin-top:2px;padding-top:9px}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.amt{font-size:30px;font-weight:800;height:64px;min-height:64px;line-height:64px;text-align:center}
.step{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:12px;padding:3px;flex-shrink:0}
.step button{width:40px;height:38px;border:none;background:var(--surface);border-radius:9px;font-size:18px;font-weight:700}
.step span{min-width:46px;text-align:center;font-weight:800;font-size:15px}
.prm{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.prm:first-child{border-top:none}.prm .tx{flex:1;font-size:14px;min-width:0}
.hrow{display:grid;grid-template-columns:48px auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:none}
.hrow select.inp{height:44px;min-height:44px;line-height:44px;padding:0 26px 0 10px;font-size:15px;background-position:right 8px center}
.hrow .off{grid-column:3 / 5;color:var(--muted);font-size:13px;text-align:center}
.chev{color:var(--muted);flex-shrink:0}
select.inp.sm{height:40px;min-height:40px;line-height:40px;font-size:14px;padding:0 30px 0 10px;background-position:right 10px center;border-radius:12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 116px 116px;gap:8px;align-items:center}
.pgrid .h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:center}
.field.bad>label{color:var(--neg)}
.field.bad>label::after{content:" · Υποχρεωτικό";font-weight:600;font-size:12px}
.field.bad .inp:not(.ok),.field.bad .svc:not(.on),.inp.bad{border-color:var(--neg)!important;background:var(--negbg)}
.warn{background:var(--negbg);color:var(--neg);border:1.5px solid var(--neg);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.warn b{font-size:14px}
.blk.ovl{box-shadow:inset 0 0 0 2px var(--neg),0 0 0 1.5px var(--bg)}
.plt{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) 20px;gap:6px;align-items:center;padding:9px 8px;font-size:13.5px;font-variant-numeric:tabular-nums;border:none;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;width:100%;border-radius:10px;font-family:inherit}
.plt span:nth-child(2),.plt span:nth-child(3),.plt span:nth-child(4){text-align:right}
.plt.th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:none}
.plt .pc{display:block;font-size:11px;font-weight:600;color:var(--muted);font-style:normal}
.blk.oss{box-shadow:inset 0 0 0 2px var(--neg),0 0 0 1.5px var(--bg);background:var(--negbg)!important;color:var(--ink)}
.blk .osb{color:var(--neg);font-size:13px;line-height:1;flex-shrink:0}
.col.offcol .blk{opacity:1}
.blk .ov{display:inline-flex;align-items:center;gap:2px;background:var(--neg);color:#fff;border-radius:6px;padding:0 5px;font-size:10px;font-weight:800;flex-shrink:0;line-height:16px}
.sday{background:var(--surface);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sday.now{outline:2.5px solid var(--teal)}
.sday h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.sst{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.sst:first-of-type{border-top:none;padding-top:0}
.sst .hd{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:700}
.sst .hd span{font-weight:400;color:var(--muted);font-size:12px}
.pp{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;background:var(--chip)}
.pp.me{background:var(--tealbg);color:var(--tealink);box-shadow:inset 0 0 0 1.5px var(--teal)}
.pp small{font-weight:500;color:var(--muted);font-size:11px}.pp.me small{color:var(--tealink)}
.soff{font-size:12px;color:var(--muted)}
.shrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px}
.ga{display:flex;flex-direction:column;gap:10px}
.gday{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:start}
.gday + .gday{border-top:1px solid var(--line);padding-top:10px}
.gday .dn{font-weight:800;font-size:13px;line-height:1.1;padding:3px 0 0;border:none;background:none;text-align:left;color:var(--ink)}
.gday .dn small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.gday.today .dn{color:var(--teal)}
.lanes{position:relative;display:flex;flex-direction:column;gap:4px;padding-block:2px;min-width:0}
.lanes .grid{position:absolute;inset:0;pointer-events:none}
.lanes .grid i{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.bar{position:relative;height:28px;border-radius:14px;display:flex;align-items:center;gap:6px;padding:0 8px 0 2px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:28px}
.bar .av{width:24px;height:24px;font-size:10px;border:2px solid var(--surface)}
.bar small{font-weight:500;opacity:.8}
.bar.me{box-shadow:inset 0 0 0 2px var(--teal)}
.offrow{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.offrow .av{width:20px;height:20px;font-size:9px;opacity:.6}
.axis{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px}
.axis div{position:relative;height:14px;font-size:10px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.catbar .tr{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.catbar .tr i{display:block;height:6px;border-radius:3px;background:var(--teal)}
.cf{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:800;padding:0 5px;flex-shrink:0;line-height:1}
.cf.need,.cf.sent,.cf.na{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--amber)}
.cf.urg{background:var(--neg);color:#fff;box-shadow:none}
.cf.ok{background:var(--posbg);color:var(--pos)}
.cf.chg{background:var(--neg);color:#fff}
.cfc{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cfc.urg{box-shadow:inset 0 0 0 2px var(--neg)}
.cfc .acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cfc .acts .btn{min-height:44px;font-size:12px;padding:0 4px;border-radius:14px;flex-direction:column;gap:2px;text-decoration:none}
.cfc .acts .btn span{font-size:16px;line-height:1}
.cflog{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.tplchips{display:flex;flex-wrap:wrap;gap:6px}
.tplchips button{border:1.5px dashed var(--line);background:var(--chip);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--ink)}
.bubble{background:var(--tealbg);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.pen{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.cf.wait{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--amber)}
.toast{display:flex;align-items:center;gap:12px;text-align:left;width:min(400px, calc(100% - 32px))}
.toast button{border:none;background:none;color:var(--tealbg);font-weight:800;font-size:14px;text-decoration:underline;padding:4px 0;flex-shrink:0}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{background:var(--surface);border-radius:16px;padding:10px 12px}
.sum b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.sum span{font-size:11px;color:var(--muted)}
.todo{background:var(--surface);border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;border:none;width:100%;text-align:left;min-height:64px}
.todo .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.todo .tx{flex:1;min-width:0}
.todo .go{background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;flex-shrink:0}

function storeHours(storeId, d){
  const h = S.ctx.hours.find(x => x.store_id === storeId && x.weekday === wdOf(d));
  if (!h || h.closed) return null;
  return [toTime(h.opens), toTime(h.closes)];
}
// Η «μέρα εργασίας»: σήμερα, εκτός αν το κατάστημα έκλεισε (ή είναι κλειστό σήμερα) → η επόμενη ανοιχτή μέρα
function workDay(storeId){
  const t = today(), hrs = storeHours(storeId || S.store, t), n = new Date(), nowM = n.getHours() * 60 + n.getMinutes();
  if (hrs && nowM < hrs[1]) return t;
  let d = t; for (let i = 0; i < 14; i++){ d = addDays(d, 1); if (storeHours(storeId || S.store, d)) return d; }
  return t;
}
function techsFor(storeId, d){
  const w = wdOf(d), ds = ymd(d);
  const sched = S.ctx.schedule.filter(s => s.store_id === storeId && s.weekday === w && S.ctx.techs.some(t => t.id === s.member_id)).map(s => s.member_id);
  const on = [], off = [];
  sched.forEach(id => {
    const isOff = S.ctx.timeOff.some(o => o.member_id === id && ds >= o.date_from && ds <= o.date_to);
    (isOff ? off : on).push(id);
  });
  const order = id => S.ctx.techs.findIndex(t => t.id === id);
  return { on: on.sort((a,b) => order(a)-order(b)), off };
}
// Ραντεβού που πέφτει εκτός προγράμματος (κλειστό κατάστημα, ρεπό, εκτός βάρδιας) → κείμενο προειδοποίησης ή null
function offSched(a, storeId){
  if (!a || a.status !== 'booked' || !a.tech_id) return null;
  const sid = a.store_id || storeId || S.store, d = new Date(a.starts_at), ds = ymd(d), w = wdOf(d);
  const s = minsOf(a.starts_at), e = minsOf(a.ends_at), t = S.ctx.techs.find(x => x.id === a.tech_id);
  const hrs = storeHours(sid, d);
  if (!hrs) return 'Το κατάστημα είναι κλειστό αυτή τη μέρα.';
  if (!t) return 'Η τεχνίτρια δεν είναι πια ενεργή.';
  const off = S.ctx.timeOff.find(o => o.member_id === t.id && ds >= o.date_from && ds <= o.date_to);
  if (off) return `Η ${esc(t.name)} έχει ${off.kind === 'leave' ? 'άδεια' : 'ρεπό'} αυτή τη μέρα.`;
  if (!S.ctx.schedule.some(x => x.member_id === t.id && x.weekday === w && x.store_id === sid)) return `Η ${esc(t.name)} δεν δουλεύει ${WDF[w]} σε αυτό το κατάστημα.`;
  const sh = shiftOf(sid, d, t.id);
  if (!sh) return `Η ${esc(t.name)} δεν έχει βάρδια αυτή τη μέρα.`;
  if (s < sh[0] || e > sh[1]) return `Εκτός βάρδιας: η ${esc(t.name)} δουλεύει ${hm(sh[0])}–${hm(sh[1])}.`;
  return null;
}
// Υπερκαλύψεις ραντεβού της ίδιας τεχνίτριας (στριμωγμένα)
function overlapMap(list){
  const act = list.filter(a => ['booked','arrived','done'].includes(a.status)), out = {};
  act.forEach(a => {
    const s1 = new Date(a.starts_at), e1 = new Date(a.ends_at);
    act.forEach(b => {
      if (a === b || a.tech_id !== b.tech_id) return;
      const s2 = new Date(b.starts_at), e2 = new Date(b.ends_at);
      const ov = Math.min(e1, e2) - Math.max(s1, s2);
      if (ov > 0) (out[a.id] = out[a.id] || []).push({ a: b, min: Math.round(ov / 60000) });
    });
  });
  return out;
}
// Ώρες βάρδιας: το ωράριο του καταστήματος, περιορισμένο από τις ώρες του προγράμματος (αν έχουν οριστεί)
function shiftOf(storeId, d, memberId){
  const h = storeHours(storeId, d); if (!h) return null;
  const sc = S.ctx.schedule.find(x => x.member_id === memberId && x.weekday === wdOf(d) && x.store_id === storeId);
  if (!sc || !sc.starts) return h;
  const a = Math.max(h[0], toTime(sc.starts)), b = Math.min(h[1], toTime(sc.ends));
  return b > a ? [a, b] : null;
}
function gapsFor(storeId, d, techId, appts){
  const h = shiftOf(storeId, d, techId); if (!h) return [];
  const list = appts.filter(a => a.tech_id === techId && sameDay(new Date(a.starts_at), d) && ['booked','arrived','done'].includes(a.status))
                    .map(a => [minsOf(a.starts_at), minsOf(a.ends_at)]).sort((a,b) => a[0]-b[0]);
  let m = h[0];
  if (sameDay(d, today())) { const n = new Date(); const now = Math.ceil((n.getHours()*60 + n.getMinutes())/15)*15; m = Math.max(m, now); }
  const out = [];
  list.forEach(([s,e]) => { if (s - m >= 30) out.push([m, s]); m = Math.max(m, e); });
  if (h[1] - m >= 30) out.push([m, h[1]]);
  return out;
}

function cashTotals(mv, opening){
  const t = { cash:0, card:0, out:0, appt:0, prod:0, n:0 };
  mv.forEach(m => {
    const a = Number(m.amount);
    if (m.kind === 'drawer_out'){ t.out += a; return; }
    t[m.method] += a; t.n++; if (m.kind === 'product') t.prod += a; else t.appt += a;
  });
  t.total = t.cash + t.card;
  t.expected = Number(opening || 0) + t.cash - t.out;
  return t;
}
async function loadCash(){
  const st = S.store, d = cashDayStr();
  const [cd, mv] = await Promise.all([
    sb.from('cash_days').select('*').eq('store_id', st).eq('day', d).maybeSingle(),
    sb.from('cash_movements').select('id,kind,method,amount,list_amount,note,created_at,appointment_id,cash_day_id,appointments(id,clients(name))').eq('store_id', st).eq('day', d).order('created_at', { ascending:false })
  ]);
  if (cd.error) throw cd.error;
  if (mv.error) throw mv.error;
  S.cash.cd = cd.data; S.cash.mv = mv.data || [];
  const from = ymd(addDays(today(), -30));
  if (seesMoney()){
    const [days, mvs] = await Promise.all([
      sb.from('cash_days').select('id,day,opening,counted,expected,difference,closed_at').eq('store_id', st).gte('day', from).lt('day', ymd(today())).order('day', { ascending:false }),
      sb.from('cash_movements').select('day,kind,method,amount').eq('store_id', st).gte('day', from).lt('day', ymd(today())).limit(10000)
    ]);
    if (days.error) throw days.error;
    const tot = {};
    (mvs.data || []).forEach(m => { if (m.kind !== 'drawer_out') tot[m.day] = (tot[m.day] || 0) + Number(m.amount); });
    S.cash.hist = (days.data || []).map(x => ({ day:x.day, closed:!!x.closed_at, diff:x.difference == null ? null : Number(x.difference), total: tot[x.day] || 0 }));
  } else {
    const r = await sb.rpc('cash_day_history', { p_store: st, p_days: 30 });
    S.cash.hist = r.error ? [] : (r.data || []).map(x => ({ day:x.day, closed:x.closed, hasDiff:x.has_difference }));
  }
  if (isTodayCash() && can('appts','view')){
    const t0 = today(), r = await sb.from('appointments').select('id,org_id,store_id,starts_at,ends_at,tech_id,status,client_id,created_at,confirm_state,confirm_token,clients(id,name,phone,note),appointment_services(id,name,price,duration_min,service_id)')

    S.cash.unpaid = r.error ? [] : r.data.map(a => ({ ...a, client: a.clients, svcText: (a.appointment_services || []).map(x => x.name).join(', ') }));
  } else S.cash.unpaid = [];
  S.cash.loaded = true;
}

  if (s0 <= now) return null;
  if (a.confirm_state === 'confirmed') return { k:'ok', label:'Επιβεβαιώθηκε', sym:'✓' };
  if (a.confirm_state === 'change_requested') return { k:'chg', label:'Ζήτησε αλλαγή', sym:'!' };

async function uploadBanner(file){
  const X = S.set, B = X.bDraft; if (!B || !file) return;
  if (!/^image\//.test(file.type)){ toast('Διάλεξε φωτογραφία'); return; }
  B.uploading = true; paint();
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
    const sc = Math.min(1, 1600 / img.width), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.85));
    const path = `${S.ctx.org.id}/${B.sid}-banner-${Date.now()}.jpg`;
    const up = await sb.storage.from('public-assets').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw up.error;
    B.banner = sb.storage.from('public-assets').getPublicUrl(path).data.publicUrl;
    toast('Η φωτογραφία ανέβηκε · πάτα «Αποθήκευση»');
  } catch(e){ toast('Δεν ανέβηκε: ' + friendlyError(e)); }
  B.uploading = false; paint();
}

function renderScheduleDay(){

  const people = [...new Set(S.ctx.schedule.filter(x => x.store_id === sid && mem(x.member_id)).map(x => x.member_id))]

  let H0 = 24*60, H1 = 0;

function renderExpenses(){

  if (!X.loaded) return storeSeg() + (S.busy ? `<div class="center"><div class="spin"></div></div>` : `<div class="center">Δεν φόρτωσαν τα έξοδα.<button class="pill" data-a="refresh">Δοκίμασε ξανά</button></div>`);

  const sup = id => (X.sup.find(x => x.id === id) || {}).name;
  const mo = X.month, wr = can('expenses','write');
  const real = X.list.filter(e => !e.expected), est = X.list.filter(e => e.expected);
  const sum = (arr, f) => arr.reduce((a, e) => a + f(e), 0);
  const tot = sum(real, e => Number(e.gross)), estTot = sum(est, e => Number(e.gross));
  const fixed = sum(X.list.filter(e => cat(e.category_id).is_fixed), e => Number(e.gross)), varb = sum(X.list.filter(e => !cat(e.category_id).is_fixed), e => Number(e.gross));

  h += `<div style="display:flex;align-items:center;gap:6px">

  h += `<div class="kpi"><div class="lbl">Έξοδα μήνα · ${esc(storeName(S.store))}</div><div class="big num">${eur(tot)}</div>
    ${estTot ? `<div style="font-size:13px;color:var(--headmuted)" class="num">+ ${eur(estTot)} εκτίμηση σταθερών που δεν έχουν μπει</div>` : ''}
    <div class="split3"><div>Σταθερά<b class="num">${eur(fixed)}</b></div><div>Μεταβλητά<b class="num">${eur(varb)}</b></div></div>
    <div style="font-size:12px;color:var(--headmuted)" class="num">Καθαρά ${eur(net)} · ΦΠΑ εισροών ${eur(vatIn)}</div></div>`;
  h += `<div class="seg"><button class="${X.view!=='fixed'?'on':''}" data-a="exView" data-v="list">Κινήσεις</button><button class="${X.view==='fixed'?'on':''}" data-a="exView" data-v="fixed">Σταθερά${est.length ? ' (' + est.length + ')' : ''}</button></div>`;
  if (X.view === 'fixed'){
    const m0 = ymd(mo), m1 = ymd(new Date(mo.getFullYear(), mo.getMonth() + 1, 1));
    if (!X.rec.length) h += `<div class="card" style="font-size:14px;color:var(--muted)">Δεν υπάρχουν σταθερά έξοδα για ${esc(storeName(S.store))}.${role() === 'admin' ? ' Πρόσθεσε ενοίκιο, ΔΕΗ, λογιστή κ.λπ. για να μπαίνει κάθε μήνα εκτίμηση μέχρι να έρθει το πραγματικό ποσό.' : ''}</div>`;
    else h += `<div class="card flush">${X.rec.map(r => {
      const e = X.list.find(x => x.recurring_id === r.id && x.day >= m0 && x.day < m1);
      const st = !r.active ? '<span class="tag t-gray">Ανενεργό</span>'

        : e.expected ? `<span class="tag t-gold num">Εκτίμηση ${eur0(e.gross)}</span>` : `<span class="tag t-teal num">Πληρώθηκε ${eur0(e.gross)}</span>`;
      const sub = `${cat(r.category_id).name}${r.supplier_id ? ' · ' + esc(sup(r.supplier_id) || '') : ''} · ${r.every_months === 2 ? 'κάθε 2 μήνες' : 'κάθε μήνα'}, στις ${r.day_of_month}`;
      return `<div class="row" style="flex-wrap:wrap;${r.active ? '' : 'opacity:.55'}"><button style="flex:1;min-width:0;border:none;background:none;text-align:left;padding:0" ${role() === 'admin' ? `data-a="recEdit" data-v="${r.id}"` : 'disabled'}><span class="t1" style="display:block">${esc(r.label || cat(r.category_id).name)}</span><span class="t2" style="display:block">${sub} · εκτίμηση ${eur0(r.estimate)}</span></button>${st}
        ${e && e.expected && wr ? `<button class="btn primary" style="min-height:40px;font-size:13px;width:100%;margin-top:4px" data-a="exEdit" data-v="${e.id}">Καταχώριση πραγματικού ποσού</button>` : ''}</div>`; }).join('')}</div>`;
    if (role() === 'admin') h += `<button class="btn navy" data-a="recEdit" data-v="">+ Σταθερό έξοδο</button>`;
    h += `<div class="t2" style="margin:0 2px">Κάθε μήνα μπαίνει αυτόματα η εκτίμηση. Όταν έρθει ο λογαριασμός, καταχωρείς το πραγματικό ποσό και αντικαθιστά την εκτίμηση στο P&L.</div>`;
    return h;
  }
  // ανά κατηγορία
  const by = {};
  real.forEach(e => { by[e.category_id] = (by[e.category_id] || 0) + Number(e.gross); });
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), mx = rows.length ? rows[0][1] : 1;

}

function renderToday(){

// ===== Ενέργειες =====
let toastT;
function toast(msg, undo){ S.toast = { msg, undo: undo || null }; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; paint(); }, undo ? 6000 : 2800); paint(); }
function paint(){
  const m = document.getElementById('main'), y = m ? m.scrollTop : 0;
  const sb2 = document.querySelector('.sheet .sb'), sy = sb2 ? sb2.scrollTop : 0;
  const act = document.activeElement, actId = act && act.id, pos = act && act.selectionStart;
  render();
  const m2 = document.getElementById('main'); if (m2) m2.scrollTop = y;
  const s3 = document.querySelector('.sheet .sb'); if (s3) s3.scrollTop = sy;
  if (actId){ const n = document.getElementById(actId); if (n && n.focus){ n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch(e){} } }
}
async function openNew(d, t, m){
  const day = d || (S.day || today());
  S.sheet = { type:'new', store: S.store, d: day, t: null, m: m ?? null, svcs: [], cat: S.ctx.cats[0] && S.ctx.cats[0].id, q:'', results:[], client:null, appts: [] };
  await loadNewDay(t);
}
async function loadNewDay(preferTech){
  const sh = S.sheet, d0 = at(sh.d, 0);
  const { data, error } = await sb.from('appointments').select('id,tech_id,starts_at,ends_at,status,clients(name)').eq('store_id', sh.store)
    .gte('starts_at', d0.toISOString()).lt('starts_at', addDays(d0, 1).toISOString()).in('status', ['booked','arrived','done']);
  if (error){ sh.err = friendlyError(error); paint(); return; }
  sh.appts = sh.replace ? data.filter(x => x.id !== sh.replace.id) : data;
  const on = techsFor(sh.store, sh.d).on;
  sh.t = preferTech && on.includes(preferTech) ? preferTech : (on.find(t => gapsFor(sh.store, sh.d, t, sh.appts).length) || on[0] || null);
  if (sh.m == null && sh.t){
    const ro = sh.replace && sameDay(new Date(sh.replace.starts_at), sh.d) && sh.replace.tech_id === sh.t ? minsOf(sh.replace.starts_at) : null;
    const g = gapsFor(sh.store, sh.d, sh.t, sh.appts); sh.m = ro != null && g.some(x => ro >= x[0] && ro < x[1]) ? ro : (g[0] ? g[0][0] : null);
  }
  paint();
}
let searchT;
function searchClients(q){
  const sh = S.sheet; sh.q = q;
  clearTimeout(searchT);
  if (!q.trim()){ sh.results = []; sh.searched = false; paint(); return; }
  searchT = setTimeout(async () => {
    const term = q.trim().replace(/[%,()]/g, '');
    const { data } = await sb.from('clients').select('id,name,phone,note').eq('org_id', S.ctx.org.id).eq('anonymized', false)
      .or(`name.ilike.%${term}%,phone.ilike.%${term.replace(/\s/g,'')}%`).order('name').limit(6);
    if (S.sheet !== sh) return;
    sh.results = data || []; sh.searched = true; paint();
  }, 250);
}
async function ensureClient(sh){
  if (sh.client) return sh.client.id;
  if (!sh.newClient) throw new Error('Διάλεξε πελάτισσα.');
  const name = (sh.ncName||'').trim(), phone = (sh.ncPhone||'').replace(/\s/g,'');
  if (!name) throw new Error('Γράψε το όνομα της νέας πελάτισσας.');
  if (phone){
    const { data: ex } = await sb.from('clients').select('id,name,phone,note').eq('org_id', S.ctx.org.id).eq('phone', phone).limit(1);
    if (ex && ex.length){ sh.client = ex[0]; sh.newClient = false; throw new Error('Υπάρχει ήδη πελάτισσα με αυτό το τηλέφωνο (' + ex[0].name + '). Την επιλέξαμε. Πάτα ξανά για να συνεχίσεις.'); }
  }
  const { data, error } = await sb.from('clients').insert({ org_id: S.ctx.org.id, name, phone: phone || null, gdpr_consent: !!sh.ncGdpr }).select('id,name,phone,note').single();
  if (error) throw error;
  sh.client = data; sh.newClient = false;
  return data.id;
}
async function bookSlot({ storeId, techId, clientId, start, end, svcs, squeezed, confirmed }){
  const row = { org_id: S.ctx.org.id, store_id: storeId, tech_id: techId, client_id: clientId, starts_at: start.toISOString(), ends_at: end.toISOString(), squeezed: !!squeezed };
  if (confirmed) Object.assign(row, { confirm_state:'confirmed', confirmed_at: new Date().toISOString(), confirmed_via:'staff' });
  const { data: ap, error } = await sb.from('appointments').insert(row).select('id').single();
  if (error) throw error;
  sb.from('freed_slots').update({ resolved: true }).eq('tech_id', techId).eq('resolved', false).lt('starts_at', end.toISOString()).gt('ends_at', start.toISOString()).then(() => {}, () => {});
  if (svcs.length){
    const rows = svcs.map(s => ({ org_id: S.ctx.org.id, store_id: storeId, appointment_id: ap.id, service_id: s.id, name: s.name, duration_min: s.duration_min, price: s.price }));
    const r = await sb.from('appointment_services').insert(rows);
    if (r.error) throw r.error;
  }
  return ap.id;
}
async function ensureCashDay(storeId, dayStr){
  const d = dayStr || ymd(today());
  const { data } = await sb.from('cash_days').select('id,closed_at').eq('store_id', storeId).eq('day', d).maybeSingle();

    S.ctx = await loadContext();
    if (S.ctx && S.ctx.stores.length){
      S.store = S.ctx.stores[0].id; S.month = new Date(today().getFullYear(), today().getMonth(), 1); S.day = null; S.view = 'cal'; S.tab = 'today';
      S.loading = false;
      try { startRealtime(); } catch(e) {}
      await refresh(); return;
    }
    // Όχι μέλος επιχείρησης — μήπως είναι ο πάροχος (super admin);
    const { data: pa } = await sb.from('platform_admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (pa){ S.super = true; await loadSuper(); S.loading = false; render(); return; }
  } catch(e){ S.loading = false; render(); toast(friendlyError(e)); return; }
  S.loading = false; render();
}
async function loadSuper(){
  const { data, error } = await sb.rpc('admin_orgs');
  if (error) throw error;
  S.sa = { orgs: data || [], loaded: true };
}
setInterval(() => { if (S.ctx && !S.sheet) quietRefresh(); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.ctx) quietRefresh(); });
let bootedFor;
sb.auth.onAuthStateChange((evt, session) => {
  const uid = session ? session.user.id : null;
  if (uid === bootedFor && evt !== 'SIGNED_OUT') { S.session = session; return; }
  bootedFor = uid; boot(session);
});
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
