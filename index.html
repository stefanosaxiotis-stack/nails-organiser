*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px}

.rbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--head2);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}

.card{background:var(--surface);border-radius:22px;padding:16px}

</style>

  lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  bell:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',

};

// ===== Κατάσταση =====
const S = {
  session:null, loading:true, loginErr:null,
  ctx:null,               // { member, org, settings, stores, levels, techs, hours, schedule, timeOff, services, cats }
  tab:'appts', store:null, view:'cal', month:null, day:null, freeOnly:false,
  monthAppts:[], dayAppts:[], wait:[], winter:new Set(), freed:null,
  sheet:null, toast:null, busy:false
};

// ===== Δεδομένα =====
async function loadContext(){
  const uid = S.session.user.id;
  const { data: mem, error } = await sb.from('members').select('*').eq('user_id', uid).eq('active', true).limit(1);
  if (error) throw error;
  if (!mem || !mem.length) return null;
  const member = mem[0], org_id = member.org_id;
  const [org, settings, stores, mstores, rperm, mperm, members, hours, sched, off, cats, svcs] = await Promise.all([
    sb.from('organizations').select('*').eq('id', org_id).single(),
    sb.from('org_settings').select('*').eq('org_id', org_id).single(),
    sb.from('stores').select('*').eq('org_id', org_id).eq('active', true).order('name'),
    sb.from('member_stores').select('*').eq('member_id', member.id),
    sb.from('role_permissions').select('*').eq('org_id', org_id),
    sb.from('member_permissions').select('*').eq('member_id', member.id),
    sb.from('members').select('id,name,role,active').eq('org_id', org_id).eq('active', true).order('name'),
    sb.from('store_hours').select('*').eq('org_id', org_id),
    sb.from('tech_schedule').select('*').eq('org_id', org_id),
    sb.from('tech_time_off').select('*').eq('org_id', org_id).gte('date_to', ymd(addDays(today(), -60))),
    sb.from('service_categories').select('*').eq('org_id', org_id).order('sort'),
    sb.from('services').select('*').eq('org_id', org_id).order('sort')
  ]);
  for (const r of [org, settings, stores, mstores, rperm, mperm, members, hours, sched, off, cats, svcs]) if (r.error) throw r.error;
  const levels = {};
  for (const tab of ['appts','clients','cash','expenses','pl','services']){
    if (member.role === 'admin') { levels[tab] = 'full'; continue; }
    const own = mperm.data.find(p => p.tab === tab);
    const rl = rperm.data.find(p => p.role === member.role && p.tab === tab);
    levels[tab] = (own && own.level) || (rl && rl.level) || 'none';
  }
  const myStoreIds = member.role === 'admin' ? stores.data.map(s => s.id) : mstores.data.map(s => s.store_id);
  const techs = members.data.filter(m => m.role === 'user');
  techs.forEach((t, i) => t.color = TECH_COLORS[i % TECH_COLORS.length]);
  return { member, org: org.data, settings: settings.data, stores: stores.data.filter(s => myStoreIds.includes(s.id)),
           levels, techs, hours: hours.data, schedule: sched.data, timeOff: off.data, cats: cats.data, services: svcs.data };
}
const can = (tab, need) => S.ctx && LV.indexOf(S.ctx.levels[tab]) >= LV.indexOf(need || 'view');
const role = () => S.ctx.member.role;
const isTech = () => role() === 'user';
const seesMoney = () => can('pl', 'view');
const storeName = id => (S.ctx.stores.find(s => s.id === id) || {}).name || '';
const tech = id => S.ctx.techs.find(t => t.id === id) || { name: '—', color: TECH_COLORS[1] };
const svcById = id => S.ctx.services.find(s => s.id === id);

function storeHours(storeId, d){
  const h = S.ctx.hours.find(x => x.store_id === storeId && x.weekday === wdOf(d));
  if (!h || h.closed) return null;
  return [toTime(h.opens), toTime(h.closes)];
}
function techsFor(storeId, d){
  const w = wdOf(d), ds = ymd(d);
  const sched = S.ctx.schedule.filter(s => s.store_id === storeId && s.weekday === w).map(s => s.member_id);
  const on = [], off = [];
  sched.forEach(id => {
    const isOff = S.ctx.timeOff.some(o => o.member_id === id && ds >= o.date_from && ds <= o.date_to);
    (isOff ? off : on).push(id);
  });
  const order = id => S.ctx.techs.findIndex(t => t.id === id);
  return { on: on.sort((a,b) => order(a)-order(b)), off };
}
function gapsFor(storeId, d, techId, appts){
  const h = storeHours(storeId, d); if (!h) return [];
  const list = appts.filter(a => a.tech_id === techId && sameDay(new Date(a.starts_at), d) && ['booked','arrived','done'].includes(a.status))
                    .map(a => [minsOf(a.starts_at), minsOf(a.ends_at)]).sort((a,b) => a[0]-b[0]);
  let m = h[0];
  if (sameDay(d, today())) { const n = new Date(); const now = Math.ceil((n.getHours()*60 + n.getMinutes())/15)*15; m = Math.max(m, now); }
  const out = [];
  list.forEach(([s,e]) => { if (s - m >= 30) out.push([m, s]); m = Math.max(m, e); });
  if (h[1] - m >= 30) out.push([m, h[1]]);
  return out;
}

async function loadMonth(){
  const m0 = new Date(S.month.getFullYear(), S.month.getMonth(), 1), m1 = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1);
  if (isTech()){
    const { data, error } = await sb.rpc('my_tech_appointments', { p_from: ymd(m0), p_to: ymd(addDays(m1,-1)) });
    if (error) throw error;
    S.monthAppts = data.filter(a => a.store_id === S.store).map(a => ({...a, tech_id: S.ctx.member.id}));
  } else {
    const sel = seesMoney() ? 'id,starts_at,ends_at,tech_id,status,appointment_services(price)' : 'id,starts_at,ends_at,tech_id,status';
    const { data, error } = await sb.from('appointments').select(sel).eq('store_id', S.store)
      .gte('starts_at', m0.toISOString()).lt('starts_at', m1.toISOString()).in('status', ['booked','arrived','done']).limit(5000);
    if (error) throw error;
    S.monthAppts = data;
  }
}
async function loadDay(){
  const d0 = at(S.day, 0), d1 = addDays(d0, 1);
  if (isTech()){
    const { data, error } = await sb.rpc('my_tech_appointments', { p_from: ymd(d0), p_to: ymd(d0) });
    if (error) throw error;
    S.dayAppts = data.filter(a => a.store_id === S.store).map(a => ({...a, tech_id: S.ctx.member.id, client: { name: a.client_first_name }, svcText: a.services }));
  } else {
    const { data, error } = await sb.from('appointments')
      .select('id,org_id,store_id,starts_at,ends_at,tech_id,status,client_id,walk_in,clients(id,name,phone,note),appointment_services(id,name,price,duration_min,service_id)')
      .eq('store_id', S.store).gte('starts_at', d0.toISOString()).lt('starts_at', d1.toISOString())
      .in('status', ['booked','arrived','done']).order('starts_at');
    if (error) throw error;
    S.dayAppts = data.map(a => ({...a, client: a.clients, svcText: a.appointment_services.map(s => s.name).join(', ')}));
  }
}
async function loadWait(){
  const { data, error } = await sb.from('waitlist').select('*, clients(id,name,phone)').eq('store_id', S.store).eq('status', 'active').order('created_at');
  if (error) throw error;
  S.wait = data;
  if (!S.winterLoaded){
    S.winterLoaded = true;
    const r = await sb.rpc('client_segments', { p_org: S.ctx.org.id });
    if (!r.error) S.winter = new Set(r.data.filter(x => x.winter).map(x => x.client_id));
  }
}
async function refresh(){
  try {
    S.busy = true; render();
    if (S.view === 'wait') await loadWait();
    else if (S.day) await loadDay(); else await loadMonth();
  } catch(e) { toast(friendlyError(e)); }
  S.busy = false; render();
}

  const app = document.getElementById('app');
  if (S.loading) { app.innerHTML = '<div class="center" style="height:100%"><div class="spin"></div></div>'; return; }

  if (!S.ctx) { app.innerHTML = `<div class="login"><h1>Nails Organiser</h1><div class="card">Ο λογαριασμός σου δεν ανήκει ακόμα σε κάποια επιχείρηση ή έχει απενεργοποιηθεί. Μίλα με τον υπεύθυνο του καταστήματος.</div><button class="btn ghost" data-a="logout">Αποσύνδεση</button></div>`; return; }
  const m = S.ctx.member;
  let head;

    const n = S.dayAppts.length;
    head = `<button class="rbtn sq" data-a="dayStep" data-v="-1" aria-label="Προηγούμενη μέρα">${I.back}</button>
      <button style="flex:1;min-width:0;border:none;background:none;color:#fff;text-align:center;padding:0" data-a="toMonth" aria-label="Πίσω στον μήνα"><h1 style="font-size:17px">${WD[wdOf(S.day)]} ${S.day.getDate()} ${MSHORT[S.day.getMonth()]}</h1><div class="sub">${n} ραντεβού</div></button>
      <button class="rbtn sq" data-a="dayStep" data-v="1" aria-label="Επόμενη μέρα">${I.fwd}</button>
      <button class="tg dark ${S.freeOnly?'on':''}" data-a="freeOnly" aria-pressed="${S.freeOnly}"><span class="k"></span>Κενά</button>`;
  } else {
    const titles = { appts: S.ctx.org.name, clients:'Πελάτες', cash:'Ταμείο', expenses:'Έξοδα', pl:'P&L' };
    const d = today();
    head = `<div style="flex:1;min-width:0"><h1>${esc(titles[S.tab])}</h1><div class="sub">${WDF[wdOf(d)]}, ${d.getDate()} ${MSHORT[d.getMonth()]} · ${ROLE_NAME[m.role]}</div></div>
      <button class="rbtn" data-a="refresh" aria-label="Ανανέωση">${I.refresh}</button>`;
  }
  const tabs = [['appts','Ραντεβού',I.cal],['clients','Πελάτες',I.users],['cash','Ταμείο',I.cash],['expenses','Έξοδα',I.exp],['pl','P&L',I.pl]].filter(([t]) => can(t));
  const badge = S.freed && matches().length ? `<span class="badge">${matches().length}</span>` : '';
  app.innerHTML = `
    <header>${head}<button class="rbtn" data-a="me" aria-label="Ο λογαριασμός μου" style="background:var(--teal);font-size:13px;font-weight:700">${esc(initials(m.name))}</button></header>
    <main id="main">${S.tab === 'appts' ? renderAppts() : renderSoon()}</main>
    ${tabs.length > 1 ? `<nav>${tabs.map(([t,n,ic]) => `<button class="${S.tab===t?'on':''}" data-a="tab" data-v="${t}">${t==='appts'?badge:''}${ic}${n}</button>`).join('')}</nav>` : ''}
    ${S.sheet ? renderSheet() : ''}
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
}
function renderLogin(){
  return `<form class="login" id="loginForm">
    <div><h1>Nails Organiser</h1><div style="color:var(--muted);margin-top:6px">Σύνδεση στο κατάστημα</div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">

      <button class="btn primary" type="submit" ${S.busy?'disabled':''}>${S.busy?'Σύνδεση…':'Σύνδεση'}</button>
    </div>
    <div style="font-size:12px;color:var(--muted);text-align:center">Ξέχασες τον κωδικό; Ζήτα από τον υπεύθυνο του καταστήματος να σου ορίσει νέο.</div>
  </form>`;
}
function renderSoon(){
  return `<div class="center">${I.lock}<div class="t1" style="color:var(--ink)">Σε κατασκευή</div><div>Αυτή η καρτέλα έρχεται στο επόμενο βήμα.</div></div>`;
}
function storeSeg(){
  if (S.ctx.stores.length < 2) return '';
  return `<div class="seg">${S.ctx.stores.map(s => `<button class="${S.store===s.id?'on':''}" data-a="store" data-v="${s.id}">${esc(s.name)}</button>`).join('')}</div>`;
}
function renderAppts(){
  if (!S.ctx.stores.length) return `<div class="center">Δεν σου έχει ανατεθεί κατάστημα. Μίλα με τον υπεύθυνο.</div>`;
  let h = '';
  if (!isTech() && !S.day) h += `<div class="seg"><button class="${S.view==='cal'?'on':''}" data-a="view" data-v="cal">Ημερολόγιο</button><button class="${S.view==='wait'?'on':''}" data-a="view" data-v="wait">Αναμονή${S.wait.length?' ('+S.wait.length+')':''}</button></div>`;
  if (S.freed && matches().length && !isTech() && S.view === 'cal') h += freedBanner();
  if (S.view === 'wait' && !isTech()) return h + storeSeg() + renderWait();
  if (S.day) return h + renderDay();
  return h + storeSeg() + renderMonth();
}
function renderMonth(){
  const y = S.month.getFullYear(), mo = S.month.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate(), t0 = today();
  const cells = [];
  for (let i = 0; i < wdOf(first); i++) cells.push('<div class="dcell blank"></div>');
  let tot = 0, rev = 0;
  for (let dn = 1; dn <= days; dn++){
    const d = new Date(y, mo, dn);
    const hrs = storeHours(S.store, d);
    const ap = S.monthAppts.filter(a => sameDay(new Date(a.starts_at), d));
    tot += ap.length;
    if (!hrs && !ap.length){ cells.push(`<div class="dcell closed"><span class="n" style="font-weight:400">${dn}</span><span class="c">κλειστά</span></div>`); continue; }
    const past = d < t0, isToday = sameDay(d, t0);
    let ts = techsFor(S.store, d).on; if (isTech()) ts = ts.filter(x => x === S.ctx.member.id);
    const cap = hrs ? ts.length * (hrs[1] - hrs[0]) : 0;
    const free = hrs ? ts.reduce((s, t) => s + gapsFor(S.store, d, t, S.monthAppts).reduce((x, g) => x + g[1] - g[0], 0), 0) : 0;
    const ratio = cap ? free / cap : 0;
    let cls = 'dcell' + (past ? ' past' : '') + (isToday ? ' today' : ''), extra = '';
    if (S.freeOnly && !past){ cls += ratio > .3 ? ' fr-hi' : ratio > .1 ? ' fr-mid' : ' fr-full'; extra = `<span class="c" style="margin-top:auto;font-weight:700;color:var(--ink)">${ratio <= .02 ? 'γεμάτη' : (Math.round(free/6)/10) + ' ώρ.'}</span>`; }
    else if (past && seesMoney() && !isTech()){ const r = ap.filter(a => a.status === 'done').reduce((s, a) => s + (a.appointment_services||[]).reduce((x, q) => x + Number(q.price), 0), 0); rev += r; extra = r ? `<span class="rev num">€${Math.round(r)}</span>` : ''; }
    else if (!past && cap){ const c = ratio > .3 ? 'var(--teal)' : ratio > .1 ? 'var(--amber)' : 'var(--coral)'; extra = `<span class="avail"><i style="width:${Math.round((1-ratio)*100)}%;background:${c}"></i></span>`; }
    cells.push(`<button class="${cls}" data-a="openDay" data-v="${ymd(d)}" aria-label="${dn} ${MONTHS[mo]}, ${ap.length} ραντεβού"><span class="n">${dn}</span><span class="c">${ap.length} ραντ.</span>${extra}</button>`);
  }
  const sub = seesMoney() && !isTech() && rev ? `${tot} ραντεβού · τζίρος ολοκληρωμένων ${eur0(rev)}` : `${tot} ραντεβού`;
  let h = `<div style="display:flex;align-items:center;gap:6px;padding-top:2px">
      <button class="x" data-a="monthStep" data-v="-1" aria-label="Προηγούμενος μήνας" style="background:transparent">${I.back}</button>
      <div style="flex:1;text-align:center"><div style="font-family:var(--font-display);font-size:20px;font-weight:600">${MONTHS[mo]} ${y}</div><div class="num" style="font-size:12px;color:var(--muted);margin-top:3px">${S.busy ? 'Φόρτωση…' : sub}</div></div>
      <button class="x" data-a="monthStep" data-v="1" aria-label="Επόμενος μήνας" style="background:transparent">${I.fwd}</button></div>
    <div style="display:flex;justify-content:center"><button class="tg ${S.freeOnly?'on':''}" data-a="freeOnly" aria-pressed="${S.freeOnly}"><span class="k"></span>Μόνο κενά</button></div>
    <div class="cal-h">${WD.map(x => `<div>${x.slice(0,2)}</div>`).join('')}</div>
    <div class="cal">${cells.join('')}</div>
    <div class="legend">${S.freeOnly
      ? '<span><i style="background:var(--posbg)"></i>Πολλά κενά</span><span><i style="background:var(--goldbg)"></i>Λίγα</span><span><i style="background:var(--negbg)"></i>Γεμάτη</span>'
      : '<span><i style="background:var(--teal)"></i>Πολλά κενά</span><span><i style="background:var(--amber)"></i>Λίγα</span><span><i style="background:var(--coral)"></i>Γεμάτη</span>'}</div>`;
  if (!isTech() && can('appts','write')) h += `<button class="btn navy" data-a="newAppt">+ Νέο ραντεβού</button>`;
  if (isTech()) h += `<div class="lock">${I.lock} Βλέπεις μόνο τα δικά σου ραντεβού. Αλλαγές κάνει η γραμματεία.</div>`;
  return h;
}
function renderDay(){
  const d = S.day, hrs = storeHours(S.store, d);
  let { on, off } = techsFor(S.store, d);
  if (isTech()){ on = on.filter(x => x === S.ctx.member.id); off = off.filter(x => x === S.ctx.member.id); if (!on.length && S.dayAppts.length) on = [S.ctx.member.id]; }
  let h = storeSeg();
  if (S.busy && !S.dayAppts.length) return h + '<div class="center"><div class="spin"></div></div>';
  if (!hrs) return h + `<div class="center"><div class="t1" style="color:var(--ink)">Το κατάστημα είναι κλειστό</div><div>Πάτα τα βελάκια για άλλη μέρα.</div></div>`;
  if (!on.length && !off.length) return h + `<div class="center"><div class="t1" style="color:var(--ink)">Καμία τεχνίτρια σε βάρδια</div><div>Ο admin ορίζει τις μέρες εργασίας από τις Ρυθμίσεις.</div></div>`;
  if (S.freeOnly){
    h += `<div style="font-size:12px;color:var(--muted)">Φαίνονται μόνο τα κενά όπου χωράει η μικρότερη υπηρεσία (30΄).</div>`;
    on.forEach(t => {
      const g = gapsFor(S.store, d, t, S.dayAppts), slots = [];
      g.forEach(x => { for (let m = x[0]; m <= x[1] - 30 && slots.length < 16; m += 15) slots.push(m); });
      h += `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:10px">${av(tech(t).name, 34, tech(t).color[0], tech(t).color[1])}<div style="flex:1"><div class="t1">${esc(tech(t).name)}</div><div class="t2">${g.length ? 'Ελεύθερη ' + g.map(x => hm(x[0]) + '–' + hm(x[1])).join(' · ') : 'Γεμάτη'}</div></div></div>
        ${slots.length ? `<div class="slots">${slots.map(m => `<button class="slot num" data-a="newAppt" data-t="${t}" data-m="${m}" ${isTech()?'disabled':''}>${hm(m)}</button>`).join('')}</div>` : ''}</div>`;
    });
    off.forEach(t => { h += `<div class="card" style="display:flex;align-items:center;gap:10px;color:var(--muted)">${av(tech(t).name, 34)}<span class="t1">${esc(tech(t).name)} · Ρεπό</span></div>`; });
    return h;
  }
  const PX = 84/60, H = (hrs[1]-hrs[0]) * PX, cols = on.concat(off);
  let hours = '', lines = '';
  for (let m = hrs[0]; m <= hrs[1]; m += 60){ hours += `<span class="num" style="position:absolute;top:${(m-hrs[0])*PX-6}px">${hm(m)}</span>`; lines += `<span class="hl" style="top:${(m-hrs[0])*PX}px"></span>`; }
  h += `<div style="display:flex;padding-left:42px">${cols.map(t => `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;${off.includes(t)?'opacity:.55':''}">${av(tech(t).name, 30, tech(t).color[0], tech(t).color[1])}<span style="font-size:12px;font-weight:700">${esc(tech(t).name)}</span></div>`).join('')}</div>`;
  h += `<div class="tl" style="height:${H+8}px"><div class="hours">${hours}</div>`;
  cols.forEach(t => {
    if (off.includes(t)) { h += `<div class="col offcol"><span class="tag t-gray" style="background:var(--surface)">Ρεπό</span></div>`; return; }
    let c = `<div class="col">${lines}`;
    S.dayAppts.filter(a => a.tech_id === t).forEach(a => {
      const s = minsOf(a.starts_at), e = minsOf(a.ends_at);

let toastT;
function toast(msg){ S.toast = msg; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; paint(); }, 2800); paint(); }
function paint(){
  const m = document.getElementById('main'), y = m ? m.scrollTop : 0;
  const sb2 = document.querySelector('.sheet .sb'), sy = sb2 ? sb2.scrollTop : 0;
  const act = document.activeElement, actId = act && act.id, pos = act && act.selectionStart;
  render();
  const m2 = document.getElementById('main'); if (m2) m2.scrollTop = y;
  const s3 = document.querySelector('.sheet .sb'); if (s3) s3.scrollTop = sy;
  if (actId){ const n = document.getElementById(actId); if (n && n.focus){ n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch(e){} } }
}
async function openNew(d, t, m){
  const day = d || (S.day || today());
  S.sheet = { type:'new', d: day, t: null, m: m ?? null, svcs: [], cat: S.ctx.cats[0] && S.ctx.cats[0].id, q:'', results:[], client:null, appts: [] };
  await loadNewDay(t);
}
async function loadNewDay(preferTech){
  const sh = S.sheet, d0 = at(sh.d, 0);
  const { data, error } = await sb.from('appointments').select('id,tech_id,starts_at,ends_at,status').eq('store_id', S.store)
    .gte('starts_at', d0.toISOString()).lt('starts_at', addDays(d0, 1).toISOString()).in('status', ['booked','arrived','done']);
  if (error){ sh.err = friendlyError(error); paint(); return; }
  sh.appts = data;
  const on = techsFor(S.store, sh.d).on;
  sh.t = preferTech && on.includes(preferTech) ? preferTech : (on.find(t => gapsFor(S.store, sh.d, t, data).length) || on[0] || null);
  if (sh.m == null && sh.t){ const g = gapsFor(S.store, sh.d, sh.t, data)[0]; sh.m = g ? g[0] : null; }
  paint();
}
let searchT;
function searchClients(q){
  const sh = S.sheet; sh.q = q;
  clearTimeout(searchT);
  if (!q.trim()){ sh.results = []; sh.searched = false; paint(); return; }
  searchT = setTimeout(async () => {
    const term = q.trim().replace(/[%,()]/g, '');
    const { data } = await sb.from('clients').select('id,name,phone,note').eq('org_id', S.ctx.org.id).eq('anonymized', false)
      .or(`name.ilike.%${term}%,phone.ilike.%${term.replace(/\s/g,'')}%`).order('name').limit(6);
    if (S.sheet !== sh) return;
    sh.results = data || []; sh.searched = true; paint();
  }, 250);
}
async function ensureClient(sh){
  if (sh.client) return sh.client.id;
  if (!sh.newClient) throw new Error('Διάλεξε πελάτισσα.');
  const name = (sh.ncName||'').trim(), phone = (sh.ncPhone||'').replace(/\s/g,'');
  if (!name) throw new Error('Γράψε το όνομα της νέας πελάτισσας.');
  if (phone){
    const { data: ex } = await sb.from('clients').select('id,name,phone,note').eq('org_id', S.ctx.org.id).eq('phone', phone).limit(1);
    if (ex && ex.length){ sh.client = ex[0]; sh.newClient = false; throw new Error('Υπάρχει ήδη πελάτισσα με αυτό το τηλέφωνο (' + ex[0].name + '). Την επιλέξαμε. Πάτα ξανά για να συνεχίσεις.'); }
  }
  const { data, error } = await sb.from('clients').insert({ org_id: S.ctx.org.id, name, phone: phone || null, gdpr_consent: !!sh.ncGdpr }).select('id,name,phone,note').single();
  if (error) throw error;
  sh.client = data; sh.newClient = false;
  return data.id;
}
async function bookSlot({ storeId, techId, clientId, start, end, svcs }){
  const { data: ap, error } = await sb.from('appointments').insert({ org_id: S.ctx.org.id, store_id: storeId, tech_id: techId, client_id: clientId,
    starts_at: start.toISOString(), ends_at: end.toISOString() }).select('id').single();
  if (error) throw error;
  if (svcs.length){
    const rows = svcs.map(s => ({ org_id: S.ctx.org.id, store_id: storeId, appointment_id: ap.id, service_id: s.id, name: s.name, duration_min: s.duration_min, price: s.price }));
    const r = await sb.from('appointment_services').insert(rows);
    if (r.error) throw r.error;
  }
  return ap.id;
}
async function ensureCashDay(storeId){
  const d = ymd(today());
  const { data } = await sb.from('cash_days').select('id,closed_at').eq('store_id', storeId).eq('day', d).maybeSingle();
  if (data){ if (data.closed_at) throw new Error('Το σημερινό ταμείο έχει κλείσει. Ο admin μπορεί να το ξανανοίξει.'); return data.id; }
  const r = await sb.from('cash_days').insert({ org_id: S.ctx.org.id, store_id: storeId, day: d, opening: 0 }).select('id').single();
  if (r.error) throw r.error;
  return r.data.id;
}

document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'loginForm') return;
  ev.preventDefault();
  const email = document.getElementById('email').value.trim(), password = document.getElementById('pw').value;
  S.busy = true; S.loginErr = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  S.busy = false;
  if (error){ S.loginErr = friendlyError(error); render(); }
});

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.classList.contains('scrim') && ev.target !== el) return;
  const a = el.dataset.a, v = el.dataset.v, sh = S.sheet;
  try {
  switch (a){
    case 'logout': S.sheet = null; await sb.auth.signOut(); return;
    case 'me': S.sheet = { type:'me' }; break;
    case 'closeSheet': S.sheet = null; break;
    case 'tab': S.tab = v; S.sheet = null; render(); return;
    case 'refresh': return refresh();
    case 'store': S.store = v; S.freed = null; return refresh();
    case 'view': S.view = v; S.day = null; return refresh();
    case 'freeOnly': S.freeOnly = !S.freeOnly; break;
    case 'monthStep': S.month = new Date(S.month.getFullYear(), S.month.getMonth() + (+v), 1); return refresh();
    case 'openDay': { const [y, mo, dd] = v.split('-').map(Number); S.day = new Date(y, mo-1, dd); S.dayAppts = []; return refresh(); }
    case 'toMonth': S.month = new Date(S.day.getFullYear(), S.day.getMonth(), 1); S.day = null; return refresh();
    case 'dayStep': {
      let d = S.day;
      for (let i = 0; i < 14; i++){ d = addDays(d, +v); if (storeHours(S.store, d)) break; }
      S.day = d; S.dayAppts = []; return refresh();
    }
    case 'openAppt': { const ap = S.dayAppts.find(x => x.id === v); if (ap) S.sheet = { type:'appt', a: ap }; break; }
    case 'newAppt': await openNew(S.day, el.dataset.t, el.dataset.m != null ? +el.dataset.m : null); return;
    case 'pickClient': { sh.client = (sh.results||[]).find(c => c.id === v); sh.err = null; break; }
    case 'clearClient': sh.client = null; sh.q = ''; sh.results = []; break;
    case 'newClient': sh.newClient = true; sh.ncName = sh.q || ''; break;
    case 'pickExisting': sh.newClient = false; break;
    case 'sheetCat': sh.cat = v; break;
    case 'pickSvc': sh.svcs = sh.svcs.includes(v) ? sh.svcs.filter(x => x !== v) : sh.svcs.concat(v); sh.err = null; break;
    case 'saveAppt': {
      sh.err = null;
      const svcs = S.ctx.services.filter(s => sh.svcs.includes(s.id));
      if (!sh.client && !sh.newClient){ sh.err = 'Διάλεξε πελάτισσα.'; break; }
      if (!svcs.length){ sh.err = 'Διάλεξε τουλάχιστον μία υπηρεσία.'; break; }
      if (!sh.t){ sh.err = 'Δεν υπάρχει τεχνίτρια σε βάρδια αυτή τη μέρα.'; break; }
      const tEl = document.getElementById('nTime'); if (tEl) sh.m = +tEl.value;
      const dur = svcs.reduce((s, x) => s + x.duration_min, 0);
      if (sh.m == null || !gapsFor(S.store, sh.d, sh.t, sh.appts).some(g => sh.m >= g[0] && sh.m + dur <= g[1])){ sh.err = 'Η ώρα δεν χωράει ' + dur + ' λεπτά. Διάλεξε άλλη ώρα.'; break; }
      S.busy = true; paint();
      try {
        const cid = await ensureClient(sh);
        await bookSlot({ storeId: S.store, techId: sh.t, clientId: cid, start: at(sh.d, sh.m), end: at(sh.d, sh.m + dur), svcs });
        if (S.freed && S.freed.tech === sh.t && sameDay(S.freed.day, sh.d)) S.freed = null;
        const d = sh.d; S.sheet = null; S.busy = false;
        toast('Κλείστηκε · ' + dlabel(d) + ' ' + hm(sh.m));
        if (S.day) S.day = d;
        return refresh();
      } catch(e){ S.busy = false; sh.err = e.message && !e.code ? e.message : friendlyError(e); }
      break;
    }
    case 'arrive': {
      const r = await sb.from('appointments').update({ status:'arrived' }).eq('id', sh.a.id);
      if (r.error) throw r.error;
      sh.a.status = 'arrived'; toast('Σημειώθηκε ότι ήρθε'); break;
    }
    case 'setStatus': {
      const ap = sh.a;
      const r = await sb.from('appointments').update({ status: v }).eq('id', ap.id);
      if (r.error) throw r.error;
      S.freed = { store: ap.store_id || S.store, day: new Date(ap.starts_at), tech: ap.tech_id, start: minsOf(ap.starts_at), dur: minsOf(ap.ends_at) - minsOf(ap.starts_at) };
      S.sheet = null;
      await loadWait();
      const n = matches().length;
      toast((v === 'no_show' ? 'Σημειώθηκε no-show' : 'Το ραντεβού ακυρώθηκε') + (n ? ' · ' + n + ' στην αναμονή ταιριάζουν' : ''));
      return refresh();
    }
    case 'pay': S.sheet = { type:'pay', a: sh.a, d: 0, m: 'card' }; break;
    case 'payD': sh.d = +v; break;
    case 'payM': sh.m = v; break;
    case 'payDone': {
      const ap = sh.a, list = (ap.appointment_services||[]).reduce((x, q) => x + Number(q.price), 0);
      const fin = list - Math.round(list * [0,10,15,20][sh.d]) / 100;
      S.busy = true; paint();
      try {
        const storeId = ap.store_id || S.store, dayId = await ensureCashDay(storeId);
        const r1 = await sb.from('cash_movements').insert({ org_id: S.ctx.org.id, store_id: storeId, cash_day_id: dayId, day: ymd(today()), kind:'appointment', list_amount: list, amount: fin, method: sh.m, appointment_id: ap.id });
        if (r1.error) throw r1.error;
        const r2 = await sb.from('appointments').update({ status:'done' }).eq('id', ap.id);
        if (r2.error) throw r2.error;
        S.sheet = null; S.busy = false; toast('Πληρώθηκε ' + eur(fin) + ' · γράφτηκε στο ταμείο');
        return refresh();
      } catch(e){ S.busy = false; sh.err = e.message && !e.code ? e.message : friendlyError(e); }
      break;
    }
    case 'newWait': S.sheet = { type:'wait', svcs: [], cat: S.ctx.cats[0] && S.ctx.cats[0].id, q:'', results:[], client:null }; break;
    case 'waitT': sh.wt = v || null; break;
    case 'waitR': sh.wr = v; break;
    case 'waitP': sh.wp = v; break;
    case 'saveWait': {
      const svcs = S.ctx.services.filter(s => sh.svcs.includes(s.id));
      if (!sh.client && !sh.newClient){ sh.err = 'Διάλεξε πελάτισσα.'; break; }
      if (!svcs.length){ sh.err = 'Διάλεξε τουλάχιστον μία υπηρεσία.'; break; }
      S.busy = true; paint();
      try {
        const cid = await ensureClient(sh);
        const r = await sb.from('waitlist').insert({ org_id: S.ctx.org.id, store_id: S.store, client_id: cid, tech_id: sh.wt || null,
          service_ids: svcs.map(s => s.id), duration_min: svcs.reduce((s, x) => s + x.duration_min, 0),
          date_from: ymd(today()), date_to: ymd(addDays(today(), +(sh.wr || 6))), time_pref: sh.wp || 'any', note: sh.note || null });
        if (r.error) throw r.error;
        S.sheet = null; S.busy = false; toast('Μπήκε στην αναμονή'); return refresh();
      } catch(e){ S.busy = false; sh.err = e.message && !e.code ? e.message : friendlyError(e); }
      break;
    }
    case 'rmWait': {
      const r = await sb.from('waitlist').update({ status:'removed' }).eq('id', v);
      if (r.error) throw r.error;
      toast('Αφαιρέθηκε από την αναμονή'); return refresh();
    }
    case 'call': S.sheet = { type:'call', id: v }; break;
    case 'fillFromWait': {
      const w = S.wait.find(x => x.id === v), f = S.freed;
      const svcs = (w.service_ids || []).map(svcById).filter(Boolean);
      S.busy = true; paint();
      try {
        await bookSlot({ storeId: f.store, techId: f.tech, clientId: w.client_id, start: at(f.day, f.start), end: at(f.day, f.start + w.duration_min), svcs });
        await sb.from('waitlist').update({ status:'booked' }).eq('id', w.id);
        let msg = 'Κλείστηκε από την αναμονή · ' + dlabel(f.day) + ' ' + hm(f.start);
        S.freed = null;
        if (w.appointment_id){
          const { data: old } = await sb.from('appointments').select('id,store_id,tech_id,starts_at,ends_at').eq('id', w.appointment_id).maybeSingle();
          if (old){
            await sb.from('appointments').update({ status:'cancelled' }).eq('id', old.id);
            S.freed = { store: old.store_id, day: new Date(old.starts_at), tech: old.tech_id, start: minsOf(old.starts_at), dur: minsOf(old.ends_at) - minsOf(old.starts_at) };
            msg = 'Μετακινήθηκε νωρίτερα · ελευθερώθηκε η παλιά θέση';
          }
        }
        S.busy = false; toast(msg); return refresh();
      } catch(e){ S.busy = false; toast(friendlyError(e)); }
      break;
    }
  }
  } catch(e){ toast(friendlyError(e)); }
  paint();
});

document.addEventListener('input', ev => {
  const id = ev.target.id, val = ev.target.value, sh = S.sheet; if (!sh) return;
  if (id === 'clientQ') return searchClients(val);
  if (id === 'ncName') sh.ncName = val;
  if (id === 'ncPhone') sh.ncPhone = val;
  if (id === 'wNote') sh.note = val;
});
document.addEventListener('change', async ev => {
  const id = ev.target.id, sh = S.sheet; if (!sh) return;
  if (id === 'ncGdpr') sh.ncGdpr = ev.target.checked;
  if (id === 'nTime') sh.m = +ev.target.value;
  if (id === 'nTech'){ sh.t = ev.target.value; const g = gapsFor(S.store, sh.d, sh.t, sh.appts)[0]; sh.m = g ? g[0] : null; paint(); }
  if (id === 'nDay' && ev.target.value){ const [y, m, d] = ev.target.value.split('-').map(Number); sh.d = new Date(y, m-1, d); sh.m = null; await loadNewDay(sh.t); }
});

// ===== Εκκίνηση =====
async function boot(session){
  S.session = session; S.ctx = null; S.sheet = null; S.freed = null; S.winterLoaded = false; S.winter = new Set(); S.wait = [];
  if (!session){ S.loading = false; render(); return; }
  S.loading = true; render();
  try {
    S.ctx = await loadContext();
    if (S.ctx && S.ctx.stores.length){
      S.store = S.ctx.stores[0].id; S.month = new Date(today().getFullYear(), today().getMonth(), 1); S.day = null; S.view = 'cal'; S.tab = 'appts';
      S.loading = false;
      if (!isTech()) { try { await loadWait(); } catch(e) {} }
      await refresh(); return;
    }
  } catch(e){ S.loading = false; render(); toast(friendlyError(e)); return; }
  S.loading = false; render();
}
let bootedFor;
sb.auth.onAuthStateChange((evt, session) => {
  const uid = session ? session.user.id : null;
  if (uid === bootedFor && evt !== 'SIGNED_OUT') { S.session = session; return; }
  bootedFor = uid; boot(session);
});
</script>
