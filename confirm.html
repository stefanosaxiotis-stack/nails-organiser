<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E1F4B">
<meta name="robots" content="noindex">
<title>Επιβεβαίωση ραντεβού</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --chip:#F1F0F6; --line:#E4E3EC; --ink:#1E1F4B; --muted:#66678A; --head:#1E1F4B; --headmuted:#B8B8D6;
  --teal:#0B7F74; --tealbg:#D6EFEB; --tealink:#0B5E55; --neg:#B3344F; --negbg:#FBE7EB; --gold:#7A4E14; --goldbg:#FBF3E6;
  --font-display:Comfortaa,"Varela Round",system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121329; --surface:#1C1D3A; --chip:#26274A; --line:#33345A; --ink:#EDEDF7; --muted:#A3A3C6; --head:#0C0D22; --headmuted:#A3A3C6;
  --teal:#13998B; --tealbg:#123F3B; --tealink:#8FE0D4; --neg:#F08AA0; --negbg:#3D1F2A; --gold:#E6C48A; --goldbg:#3A2E1A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{background:var(--head);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 26px;text-align:center}
header .org{font-family:var(--font-display);font-size:24px;font-weight:700}
header .st{font-family:var(--font-display);font-size:14px;color:var(--headmuted);margin-top:4px}
main{max-width:460px;margin:-14px auto 0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hi{font-family:var(--font-display);font-size:20px;font-weight:700}
.when{background:var(--chip);border-radius:16px;padding:14px 16px}
.when .d{font-size:18px;font-weight:800}
.when .t{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.when .s{font-size:14px;color:var(--muted);margin-top:4px}
.btn{border:none;border-radius:18px;min-height:56px;font-size:17px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.yes{background:var(--teal);color:#fff}
.no{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.send{background:var(--ink);color:var(--surface)}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);resize:vertical}
.res{text-align:center;padding:26px 20px}
.res .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.res .ic.ok{background:var(--tealbg);color:var(--tealink)}
.res .ic.wait{background:var(--goldbg);color:var(--gold)}
.res .ic.bad{background:var(--negbg);color:var(--neg)}
.res h2{font-family:var(--font-display);font-size:21px;margin:6px 0 2px}
.res p{color:var(--muted);margin:0;line-height:1.45}
.info{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.info b{color:var(--ink)}
.link{background:none;border:none;color:var(--teal);font-weight:700;font-size:15px;padding:8px;text-decoration:underline}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--neg);font-size:14px;font-weight:600;text-align:center}
</style>
</head>
<body>
<header><div class="org" id="org">Επιβεβαίωση ραντεβού</div><div class="st" id="st"></div></header>
<main id="main"><div class="spin" aria-label="Φόρτωση"></div></main>
<script>
const sb = supabase.createClient('https://koliyglqlgpwsrkjahrn.supabase.co', 'sb_publishable_0JPsGiN40GN8y4ZFRnYp2A_47M-yXM_');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = new URLSearchParams(location.search).get('t') || '';
const TZ = 'Europe/Athens';
let A = null, mode = 'ask', err = '', busy = false;
const fmtDay = iso => new Date(iso).toLocaleDateString('el-GR', { timeZone: TZ, weekday:'long', day:'numeric', month:'long' });
const fmtTime = iso => new Date(iso).toLocaleTimeString('el-GR', { timeZone: TZ, hour:'2-digit', minute:'2-digit', hour12:false });

function infoBlock(){
  const rows = [];
  if (A.address) rows.push(`<span>📍 <b>${esc(A.address)}</b></span>`);
  if (A.phone) rows.push(`<span>☎ Τηλέφωνο καταστήματος: <b style="user-select:all">${esc(A.phone)}</b></span>`);
  return rows.length ? `<div class="info">${rows.join('')}</div>` : '';
}
function whenBlock(){
  return `<div class="when"><div class="d">${esc(fmtDay(A.starts_at))}</div><div class="t">${esc(fmtTime(A.starts_at))}</div>${A.services ? `<div class="s">${esc(A.services)}</div>` : ''}</div>`;
}
function render(){
  const m = document.getElementById('main');
  if (!A){ m.innerHTML = `<div class="card res"><div class="ic bad">!</div><h2>Ο σύνδεσμος δεν βρέθηκε</h2><p>Μπορεί να έχει αντιγραφεί λάθος. Επικοινωνήστε με το κατάστημα.</p></div>`; return; }
  document.getElementById('org').textContent = A.org;
  document.getElementById('st').textContent = A.store;
  document.title = 'Ραντεβού · ' + A.org;
  if (!A.open){ m.innerHTML = `<div class="card res"><div class="ic wait">i</div><h2>Το ραντεβού έχει αλλάξει ή έχει περάσει</h2><p>Για οτιδήποτε χρειάζεστε, επικοινωνήστε με το κατάστημα.</p></div><div class="card">${infoBlock()}</div>`; return; }
  if (mode === 'ask' && A.state === 'confirmed') mode = 'done_yes';
  if (mode === 'ask' && A.state === 'change_requested') mode = 'done_no';
  let h = '';
  if (mode === 'ask'){
    h = `<div class="card"><div class="hi">Γεια σας ${esc(A.name)}!</div><div style="color:var(--muted)">Σας περιμένουμε για το ραντεβού σας:</div>${whenBlock()}
      <button class="btn yes" data-a="yes" ${busy?'disabled':''}>Θα έρθω ✓</button>
      <button class="btn no" data-a="no" ${busy?'disabled':''}>Δεν μπορώ</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>${infoBlock() ? `<div class="card">${infoBlock()}</div>` : ''}`;
  } else if (mode === 'no'){
    h = `<div class="card"><div class="hi">Κανένα πρόβλημα</div><div style="color:var(--muted)">Θα σας καλέσουμε για να βρούμε νέα ώρα. Αν θέλετε, γράψτε μας πότε σας βολεύει.</div>
      <textarea id="note" maxlength="300" placeholder="π.χ. Πέμπτη απόγευμα ή Σάββατο πρωί"></textarea>
      <button class="btn send" data-a="sendNo" ${busy?'disabled':''}>Αποστολή</button>
      <button class="link" data-a="back">Πίσω, τελικά θα έρθω</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>`;
  } else if (mode === 'done_yes'){
    h = `<div class="card res"><div class="ic ok">✓</div><h2>Ευχαριστούμε, ${esc(A.name)}!</h2><p>Το ραντεβού σας επιβεβαιώθηκε. Θα σας περιμένουμε.</p></div><div class="card">${whenBlock()}${infoBlock()}<button class="link" data-a="change">Δεν μπορώ τελικά</button></div>`;
  } else if (mode === 'done_no'){
    h = `<div class="card res"><div class="ic wait">☎</div><h2>Λάβαμε το μήνυμά σας</h2><p>Θα σας καλέσουμε σύντομα για να κανονίσουμε νέα ώρα.</p></div><div class="card">${infoBlock() || '<div class="info">Ευχαριστούμε!</div>'}<button class="link" data-a="yes">Τελικά θα έρθω κανονικά</button></div>`;
  }
  m.innerHTML = h;
}
async function respond(answer, note){
  busy = true; err = ''; render();
  try {
    const { data, error } = await sb.rpc('confirm_respond', { p_token: token, p_answer: answer, p_note: note || null });
    if (error) throw error;
    if (!data || !data.ok){ A.open = false; }
    else { A.state = data.state; mode = answer === 'yes' ? 'done_yes' : 'done_no'; }
  } catch(e){ err = 'Δεν ήταν δυνατή η αποστολή. Ελέγξτε τη σύνδεση και δοκιμάστε ξανά.'; }
  busy = false; render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || busy) return;
  const a = b.dataset.a;
  if (a === 'yes') respond('yes');
  else if (a === 'no' || a === 'change'){ mode = 'no'; err = ''; render(); }
  else if (a === 'back'){ mode = A.state === 'confirmed' ? 'done_yes' : 'ask'; if (mode === 'ask') A.state = null; render(); }
  else if (a === 'sendNo') respond('no', (document.getElementById('note') || {}).value);
});
(async () => {
  if (!/^[0-9a-f-]{36}$/i.test(token)){ A = null; render(); return; }
  try {
    const { data, error } = await sb.rpc('confirm_get', { p_token: token });
    if (error) throw error;
    A = data && data.found ? data : null;
  } catch(e){
    document.getElementById('main').innerHTML = `<div class="card res"><div class="ic bad">!</div><h2>Δεν υπάρχει σύνδεση</h2><p>Ελέγξτε το internet και ανοίξτε ξανά τον σύνδεσμο.</p></div>`; return;
  }
  render();
})();
</script>
</body>
</html>
